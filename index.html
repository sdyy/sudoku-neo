<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Neo - 智慧數獨</title>
  <meta name="description" content="一款純本地運行的現代化數獨遊戲。支援隨機難度謎題生成、智能提示、草稿輔助，帶給您最精緻的邏輯解題體驗。">
  <link rel="stylesheet" href="styles.css?v=1.1.0">
</head>
<body>
  <main class="app-container" id="app">
    
    <!-- HEADER -->
    <header>
      <div class="logo-section">
        <h1>SUDOKU Neo</h1>
        <p>優雅、智慧的本地端數獨體驗</p>
      </div>
      <div class="top-controls">
        <button id="themeToggle" class="theme-btn" aria-label="切換深淺色主題" title="切換主題">
          <!-- Light Mode Icon (Sun) -->
          <svg id="themeSun" class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z"/>
          </svg>
          <!-- Dark Mode Icon (Moon) -->
          <svg id="themeMoon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.5-.1 1 .2 1.2.7.2.5 0 1.1-.4 1.4-2.8 2-4.1 5.6-3.1 9 1 3.4 4.1 5.8 7.6 5.8.9 0 1.8-.2 2.6-.5.5-.2 1.1 0 1.4.4.3.4.3 1-.1 1.4-2 2.1-4.8 3.3-7.3 3.3zm-6.2-9.7c0 3.3 2.5 6.1 5.8 6.5-.7.1-1.3.2-2 .2-4.1 0-7.5-3.4-7.5-7.5 0-3.3 2.1-6.1 5.1-7.1-.5.9-.8 1.9-.8 3 0 2.6 1.9 4.7 4.4 4.9-1.8.8-3.6.5-5 .0z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- LEFT SIDE: BOARD & PROGRESS INFO -->
    <section class="board-panel">
      <!-- State Bar -->
      <div class="info-bar" style="width: 100%;">
        <div class="info-item">
          <span class="info-label">目前難度</span>
          <span id="diffDisplay" class="info-value">簡單</span>
        </div>
        <div class="info-item">
          <span class="info-label">失誤次數</span>
          <span id="mistakeDisplay" class="info-value">0 / 3</span>
        </div>
        <div class="info-item">
          <span class="info-label">累計時間</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="timerDisplay" class="info-value timer">00:00</span>
            <button id="pauseToggleBtn" class="theme-btn" style="width: 28px; height: 28px; border-radius: 8px; padding: 0;" title="暫停遊戲">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Sudoku Grid Element -->
      <div class="sudoku-grid" id="sudokuGrid" aria-label="數獨網格 9x9" tabindex="0">
        <!-- Cells generated by JavaScript -->
      </div>
    </section>

    <!-- RIGHT SIDE: KEYPAD & ACTIONS -->
    <section class="controls-panel">
      <!-- Game Setup Panel -->
      <div class="game-setup">
        <select id="difficultySelect" class="difficulty-select" aria-label="選擇數獨難度">
          <option value="Easy">簡單 (Naked/Hidden Single)</option>
          <option value="Medium">中等 (Pointing/Naked Pair)</option>
          <option value="Hard">困難 (Hidden Pair/X-Wing)</option>
          <option value="Expert">專家 (XY-Wing/進階推理)</option>
        </select>
        <button id="newGameBtn" class="btn-new-game">新遊戲</button>
      </div>

      <!-- Action Panel -->
      <div class="action-grid">
        <button id="undoBtn" class="action-btn" title="復原一步" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
          </svg>
          <span>復原</span>
        </button>
        <button id="redoBtn" class="action-btn" title="重做一步" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
          </svg>
          <span>重做</span>
        </button>
        <button id="eraseBtn" class="action-btn" title="清除儲存格">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L5.03 20h15.11l4.27-4.27c.78-.78.78-2.05 0-2.83L16.55 3.59c-.39-.39-.9-.59-1.41-.59zm0 2.12L22 12.98c.2.2.2.51 0 .71l-2.58 2.58-5.32-5.32 2.45-2.45c.2-.2.2-.51 0-.71l-1.41-1.41c-.2-.2-.51-.2-.71 0l-2.45 2.45-2.12-2.12 5.32-5.32c.19-.2.5-.2.7-.2zM9.13 11.23l5.32 5.32-5.74 5.74c-.2.2-.51.2-.71 0L5.3 19.59c-.2-.2-.2-.51 0-.71l3.83-3.83-2.12-2.12-3.83 3.83c-.98.98-.98 2.56 0 3.54l2.7 2.7c.49.49 1.13.73 1.77.73s1.28-.24 1.77-.73l7.86-7.86-5.32-5.32-2.12 2.12z"/>
          </svg>
          <span>擦除</span>
        </button>
        <button id="pencilBtn" class="action-btn" title="切換草稿模式">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          <span>草稿 (關)</span>
        </button>
        <button id="autoCandidatesBtn" class="action-btn" title="自動填寫所有空格候選數">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
          </svg>
          <span>自動草稿</span>
        </button>
        <button id="clearNotesBtn" class="action-btn" title="清除所有草稿數字">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
          <span>清空草稿</span>
        </button>
        <button id="hintBtn" class="action-btn" style="grid-column: span 2; background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%); border-color: var(--accent);" title="取得下一步邏輯提示">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="color: var(--accent-hover);">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
          </svg>
          <span style="color: var(--accent-hover); font-weight: 600;">邏輯提示</span>
        </button>
      </div>

      <!-- Input Keypad -->
      <div class="keypad">
        <button class="keypad-btn" data-value="1">1</button>
        <button class="keypad-btn" data-value="2">2</button>
        <button class="keypad-btn" data-value="3">3</button>
        <button class="keypad-btn" data-value="4">4</button>
        <button class="keypad-btn" data-value="5">5</button>
        <button class="keypad-btn" data-value="6">6</button>
        <button class="keypad-btn" data-value="7">7</button>
        <button class="keypad-btn" data-value="8">8</button>
        <button class="keypad-btn" data-value="9">9</button>
      </div>

      <!-- Details Panel for Steps & Guidance -->
      <div class="details-panel">
        <h3>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
          </svg>
          解題指南 & 提示說明
        </h3>
        <div id="detailsContent" class="details-content">
          歡迎使用 <strong>SUDOKU Neo</strong>！<br><br>
          • 選擇難度後點擊「新遊戲」開始。<br>
          • 點選網格，使用鍵盤或右側鍵盤填寫。<br>
          • 切換「草稿」模式來填寫候選輔助數，或點擊「自動草稿」。<br>
          • 遇到瓶頸時，點選「邏輯提示」獲得教學式步驟分析。
        </div>
      </div>
    </section>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">正在生成數獨謎題...</div>
      <div id="loadingSubtext" class="loading-subtext">正在尋找符合難度的對稱結構 (嘗試次數: 1)</div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div id="pauseOverlay" class="pause-overlay">
      <div class="loading-text" style="font-size: 24px;">遊戲暫停中</div>
      <button id="resumeGameBtn" class="btn-resume">繼續遊戲</button>
    </div>

    <!-- SUCCESS OVERLAY -->
    <div id="successOverlay" class="success-overlay">
      <div class="success-icon">🏆</div>
      <div class="success-title">恭喜完成挑戰！</div>
      <div class="success-stats">
        難度等級：<span id="statDiff">中等</span><br>
        通關時間：<span id="statTime">12:34</span><br>
        失誤次數：<span id="statMistakes">0 / 3</span><br>
        最高技巧：<span id="statTechnique">Pointing Pair</span>
      </div>
      <button id="successNewGameBtn" class="btn-resume" style="background: linear-gradient(135deg, #22c55e 0%, #06b6d4 100%); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);">再來一局</button>
    </div>

  </main>

  <!-- Load JavaScript Scripts -->
  <script src="sudoku.js?v=1.1.0"></script>
  <script src="app.js?v=1.1.0"></script>
</body>
</html>
